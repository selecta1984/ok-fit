<!doctype html>
<title>שאלון היכרות | משרד פרסום OK מהגולן</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#6CBEC5;--teal-ink:#2E8D96;--teal-wash:#EAF5F6;
  --ink:#111214;--grey:#686E72;--line:#E2E8E9;--paper:#FFFFFF;--ground:#F2F5F5;
  --f:"Montserrat","Heebo",Arial,sans-serif;color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground)}
body{font-family:var(--f);color:var(--ink);direction:rtl;-webkit-font-smoothing:antialiased}
.okq{min-height:100vh;padding:24px 16px;direction:rtl}
.okq .page{max-width:900px;margin:0 auto;background:var(--paper);min-height:calc(100vh - 48px);display:flex;flex-direction:column}
.okq .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 40px 24px}
.okq .logo img{width:118px;height:auto;display:block}
.okq .tag{background:var(--teal);color:#fff;padding:14px 20px;font-weight:700;font-size:15px;line-height:1.35;text-align:right;max-width:60%}
.okq .tag span{display:block;font-weight:400;font-size:14px}
.okq .prog{height:4px;background:var(--line);margin:0 40px}
.okq .prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .45s ease}
.okq main{flex:1;padding:44px 40px 36px;display:flex;flex-direction:column}
.okq .screen{animation:okin .35s ease both;flex:1;display:flex;flex-direction:column}
@keyframes okin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.okq .h-thin{font-weight:300;color:var(--teal);font-size:46px;line-height:1.1}
.okq .h-bold{font-weight:900;font-size:80px;line-height:1;letter-spacing:-2px;margin-top:4px}
.okq .lead{font-size:19px;line-height:1.65;max-width:640px;margin-top:26px}
.okq .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:34px 0 32px}
.okq .stat{padding:18px 18px 16px;border-left:1px solid var(--line)}
.okq .stat:last-child{border-left:0}
.okq .stat b{display:block;font-family:Montserrat,Heebo,sans-serif;font-weight:800;font-size:44px;line-height:1;color:var(--teal-ink)}
.okq .stat span{display:block;font-size:14px;color:var(--grey);margin-top:6px}
.okq .btn{background:var(--ink);color:#fff;border:0;border-radius:0;font:700 18px var(--f);padding:18px 34px;cursor:pointer;display:inline-flex;align-items:center;gap:14px;transition:background .2s}
.okq .btn:hover,.okq .btn:focus-visible{background:var(--teal-ink);outline:none}
.okq .btn[disabled]{opacity:.4;cursor:default;background:var(--ink)}
.okq .btn .ar{font-family:Montserrat,sans-serif;font-weight:400}
.okq .hint{font-size:14px;color:var(--grey);line-height:1.6;margin-top:18px;max-width:560px}
.okq .label{display:flex;align-items:center;gap:10px;color:var(--teal-ink);font-weight:700;font-size:15px}
.okq .label:before{content:"";width:12px;height:12px;background:var(--teal);flex:none}
.okq .label em{font-style:normal;font-weight:400;color:var(--grey)}
.okq .q{font-weight:900;font-size:38px;line-height:1.18;letter-spacing:-.5px;margin:16px 0 8px;outline:none}
.okq .sub{color:var(--grey);font-size:16px;line-height:1.55}
.okq .opts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:26px}
.okq .opt{background:#fff;border:0;border-radius:0;text-align:right;font:500 18px/1.4 var(--f);color:var(--ink);padding:24px 20px 20px;cursor:pointer;position:relative;display:flex;gap:14px;align-items:flex-start;min-height:78px;transition:background .15s,color .15s}
.okq .opt:last-child:nth-child(odd){grid-column:1/-1}
.okq .opt:before{content:"";position:absolute;top:0;right:20px;width:26px;height:4px;background:var(--teal);transform:scaleX(0);transform-origin:right;transition:transform .2s}
.okq .opt:focus-visible{background:var(--teal-wash);outline:none}
.okq .opt:focus-visible:before,.okq .opt.on:before{transform:scaleX(1)}
@media (hover:hover){.okq .opt:hover{background:var(--teal-wash)}.okq .opt:hover:before{transform:scaleX(1)}.okq .opt.on:hover{background:var(--ink)}}
.okq [data-focus]{outline:none}
.okq .opt.on{background:var(--ink);color:#fff}
.okq .opt .k{font-family:Montserrat,sans-serif;font-weight:700;font-size:12px;color:var(--teal-ink);border:1px solid currentColor;width:24px;height:24px;display:inline-grid;place-items:center;flex:none;margin-top:1px}
.okq .opt.on .k{color:var(--teal)}
.okq .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:32px}
.okq .back{background:none;border:0;font:500 16px var(--f);color:var(--grey);cursor:pointer;padding:10px 0}
.okq .back:hover,.okq .back:focus-visible{color:var(--ink);outline:none}
.okq .fields{display:grid;grid-template-columns:1fr 1fr;gap:26px 32px;margin-top:30px}
.okq .fields .full{grid-column:1/-1}
.okq .fields label>span{display:block;font-size:14px;font-weight:700;color:var(--grey);margin-bottom:2px}
.okq .fields label>span i{font-style:normal;font-weight:400}
.okq .field{width:100%;border:0;border-bottom:2px solid var(--ink);border-radius:0;font:400 20px var(--f);padding:10px 0;background:transparent;color:var(--ink);outline:none;transition:border-color .2s}
.okq .field:focus{border-color:var(--teal)}
.okq textarea.field{resize:vertical;min-height:120px;line-height:1.55;margin-top:26px}
.okq .field[dir=ltr]{text-align:right}
.okq .err{color:#B3261E;font-size:14px;min-height:20px;margin-top:6px}
.okq .hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.okq .hills{display:block;width:100%;height:auto;margin-top:36px}
.okq .rot{animation:okspin 9s linear infinite}
.okq .rot.s2{animation-duration:12s}
@keyframes okspin{to{transform:rotate(360deg)}}
.okq .band{background:var(--ink);color:#fff;padding:40px;margin:0 -40px}
.okq .band .lbl{color:var(--teal);font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.okq .band .lbl:before{content:"";width:12px;height:12px;background:var(--teal)}
.okq .band .t{font-weight:900;font-size:48px;line-height:1.1;margin-top:10px}
.okq .done-p{font-size:19px;line-height:1.65;margin-top:30px;max-width:620px}
.okq .closing{background:var(--teal);padding:28px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.okq .closing p{font-weight:900;font-size:24px;line-height:1.25}
.okq .closing small{display:block;font-weight:500;font-size:15px;margin-top:4px}
.okq .closing img{width:96px;height:auto;flex:none;display:block}
.okq footer{padding:18px 40px;border-top:1px solid var(--line);font-family:Montserrat,sans-serif;font-size:13px;color:var(--grey);direction:ltr;text-align:center}
.okq footer a{color:inherit;text-decoration:none}
.okq .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:okspin .8s linear infinite}
@media (max-width:640px){
  .okq{padding:0}
  .okq .page{min-height:100vh}
  .okq .top{padding:18px 16px 16px}
  .okq .logo img{width:84px}
  .okq .tag{font-size:13px;padding:10px 12px}
  .okq .tag span{font-size:12px}
  .okq .prog{margin:0 16px}
  .okq main{padding:30px 16px 24px}
  .okq .h-thin{font-size:30px}
  .okq .h-bold{font-size:54px;letter-spacing:-1px}
  .okq .lead,.okq .done-p{font-size:17px}
  .okq .stat{padding:14px 10px}
  .okq .stat b{font-size:32px}
  .okq .stat span{font-size:13px}
  .okq .q{font-size:27px}
  .okq .sub{font-size:15px}
  .okq .opts{grid-template-columns:1fr}
  .okq .opt{font-size:17px;min-height:62px;padding:20px 16px 16px}
  .okq .opt:before{right:16px}
  .okq .fields{grid-template-columns:1fr;gap:22px}
  .okq .field{font-size:18px}
  .okq .btn{font-size:17px;padding:16px 26px}
  .okq .band{padding:30px 16px;margin:0 -16px}
  .okq .band .t{font-size:34px}
  .okq .closing{padding:22px 16px}
  .okq .closing p{font-size:19px}
  .okq .closing img{width:70px}
  .okq footer{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  .okq .rot,.okq .screen{animation:none}
  .okq .prog i,.okq .opt,.okq .opt:before{transition:none}
}
</style>

    {id:"years", t:"כמה זמן העסק פעיל?", o:[["y0","פחות משנה"],["y1","1 עד 3 שנים"],["y3","3 עד 10 שנים"],["y10","יותר מ-10 שנים"]]},
    {id:"team", t:"כמה אנשים עובדים בעסק?", o:[["t1","רק אני"],["t2","2 עד 5"],["t6","6 עד 20"],["t20","יותר מ-20"]]},
    {id:"deal", t:"כמה שווה לכם לקוח חדש אחד, בממוצע?", s:"סכום העסקה הראשונה, בערך. לא צריך לדייק.", o:[["d1","עד 1,000 ₪"],["d2","1,000 עד 5,000 ₪"],["d3","5,000 עד 20,000 ₪"],["d4","מעל 20,000 ₪"]]},
    {id:"source", t:"מאיפה מגיעים היום רוב הלקוחות החדשים?", o:[["ref","המלצות ומפה לאוזן"],["google","גוגל"],["social","פייסבוק ואינסטגרם"],["plat","אתרים ופלטפורמות של התחום"],["idk","לא בטוחים"]]},
    {id:"goal", t:"מה הכי חשוב לכם להשיג בשלושת החודשים הקרובים?", o:[["leads","יותר פניות מלקוחות"],["sales","להפוך יותר פניות לעסקאות"],["brand","שיכירו אותנו יותר"],["site","אתר חדש או משודרג"],["social","נוכחות טובה יותר ברשתות"]]},
    {id:"cap", t:"אם בחודש הבא יגיעו עוד 30 פניות, תוכלו לטפל בהן?", o:[["c1","כן, בכיף"],["c2","בחלק מהן"],["c3","כרגע אנחנו בתפוסה מלאה"]]},
    {id:"speed", t:"תוך כמה זמן חוזרים היום לפנייה חדשה?", o:[["s1","תוך שעה"],["s2","באותו יום"],["s3","תוך כמה ימים"],["s4","אין מישהו קבוע שאחראי על זה"]]},
    {id:"track", t:"אתם יודעים כמה פניות מגיעות בחודש, וכמה מהן נסגרות?", o:[["k1","כן, די במדויק"],["k2","בערך, מהראש"],["k3","לא באמת"]]},
    {id:"past", t:"איך פרסמתם עד היום?", o:[["p0","עוד לא פרסמנו בתשלום"],["p1","קידמנו פוסטים לבד"],["p2","עם מנהל קמפיינים פרילנסר"],["p3","עם משרד פרסום"]]},
    {id:"pastres", t:"ואיך זה הלך?", o:[["r1","הביא תוצאות טובות"],["r2","חלק עבד, חלק לא"],["r3","הרגשנו ששרפנו כסף"]], skipIf:function(a){return !a.past || a.past.v==="p0";}},
    {id:"site", t:"מה המצב עם האתר?", o:[["w1","יש אתר עדכני שעובד טוב"],["w2","יש אתר, אבל הוא ישן או לא מביא פניות"],["w3","אין אתר, רק רשתות חברתיות"],["w4","עוד אין לנו נוכחות דיגיטלית"]]},
    {id:"budget", t:"כמה אתם מוכנים להשקיע בשיווק בחודש?", s:"הכל ביחד: תקציב הפרסום בגוגל ובמטא, וגם הניהול המקצועי.", o:[["b1","עד 3,000 ₪"],["b2","3,000 עד 7,000 ₪"],["b3","7,000 עד 12,000 ₪"],["b4","12,000 עד 20,000 ₪"],["b5","מעל 20,000 ₪"],["b0","עוד לא יודעים, תלוי בתוצאות"]]},
    {id:"commit", t:"כמה זמן אתם מוכנים לתת לתהליך?", s:"קמפיין טוב צריך בדרך כלל חודשיים עד שלושה כדי להתייצב.", o:[["m3","3 חודשים ומעלה, ברור לנו שזה תהליך"],["m1","חודש-חודש, לפי התוצאות"],["m0","קודם רוצים לנסות חודש אחד"]]},
    {id:"decide", t:"מי מחליט על ההשקעה בשיווק?", o:[["dm1","אני"],["dm2","אני ושותף או שותפה"],["dm3","הנהלה, ועד או ועדה"]]},
    {id:"when", t:"מתי תרצו להתחיל?", o:[["n1","כמה שיותר מהר"],["n2","בחודש הקרוב"],["n3","בעוד חודש עד שלושה"],["n4","בינתיים רק בודקים אפשרויות"]]},
    {id:"note", type:"text", t:"משהו שחשוב שנדע לפני שנדבר?", s:"לא חובה. אפשר לספר מה מציק, מה ניסיתם, או מה החלום."},
    {id:"contact", type:"contact", t:"ואיך חוזרים אליכם?", s:"עוד רגע וזהו."}
  ];

  var A = {}, note = "", i = -1, t0 = Date.now(), sending = false;
  var C = {name:NAME, biz:BIZ, phone:"", email:"", link:""};
  var app = document.getElementById("okApp"), bar = document.getElementById("okBar");
  if (BIZ) document.getElementById("okBiz").textContent = BIZ;

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
  function steps(){return Q.filter(function(q){return !(q.skipIf && q.skipIf(A));});}
  function setBar(p){bar.style.width = Math.max(0, Math.min(100, p)) + "%";}
  function focusTitle(){var h = app.querySelector("[data-focus]"); if (h) h.focus({preventScroll:true}); window.scrollTo(0,0);}

  var HILLS = '<svg class="hills" viewBox="0 0 900 150" aria-hidden="true">' +
    '<defs><path id="okBl" d="M0 0 L3 -3 L1.2 -36 L-1.2 -36 L-3 -3 Z" fill="#2E8D96"/></defs>' +
    '<path d="M0 118 C120 70 220 62 330 90 C430 114 520 58 640 72 C740 84 820 60 900 74 V150 H0Z" fill="#D5ECEE"/>' +
    '<line x1="640" y1="30" x2="640" y2="74" stroke="#2E8D96" stroke-width="2.5"/>' +
    '<g class="rot" style="transform-origin:640px 30px"><g transform="translate(640 30)"><use href="#okBl"/><use href="#okBl" transform="rotate(120)"/><use href="#okBl" transform="rotate(240)"/><circle r="3.5" fill="#2E8D96"/></g></g>' +
    '<line x1="740" y1="44" x2="740" y2="82" stroke="#2E8D96" stroke-width="2"/>' +
    '<g class="rot s2" style="transform-origin:740px 44px"><g transform="translate(740 44) scale(.75)"><use href="#okBl"/><use href="#okBl" transform="rotate(120)"/><use href="#okBl" transform="rotate(240)"/><circle r="3.5" fill="#2E8D96"/></g></g>' +
    '<path d="M0 136 C140 106 260 110 380 124 C500 138 620 100 760 112 C830 118 870 112 900 115 V150 H0Z" fill="#A9D8DC"/>' +
    '</svg>';

  function welcome(){
    i = -1; setBar(0);
    var n = Q.length;
    app.innerHTML =
      '<section class="screen">' +
        '<div class="h-thin" tabindex="-1" data-focus>רגע לפני שנפגשים,</div>' +
        '<div class="h-bold">בואו נכיר.</div>' +
        '<p class="lead">' + (NAME ? "היי " + esc(NAME) + ", " : "") + 'תודה שפניתם אלינו. כדי שהשיחה הראשונה תהיה שווה את הזמן שלכם, נשמח לכמה תשובות קצרות על העסק. כמעט הכל בלחיצה אחת.</p>' +
        '<div class="stats"><div class="stat"><b>' + n + '</b><span>שאלות קצרות</span></div><div class="stat"><b>3</b><span>דקות בערך</span></div><div class="stat"><b>0</b><span>התחייבות</span></div></div>' +
        '<div><button class="btn" id="okGo" type="button">מתחילים <span class="ar">&larr;</span></button></div>' +
        '<p class="hint">אין תשובות נכונות או לא נכונות. ככל שתהיו כנים יותר, נוכל להגיד לכם בדיוק אם ואיך אנחנו יכולים לעזור.</p>' +
        HILLS +
      '</section>';
    document.getElementById("okGo").onclick = function(){ go(0); };
    focusTitle();
  }

  function go(n){
    var S = steps();
    if (n < 0) return welcome();
    if (n >= S.length) n = S.length - 1;
    i = n;
    var q = S[i], total = S.length;
    setBar(i / total * 100);
    var tagline = i === total - 1 ? " <em>אחרונה</em>" : (i === Math.floor(total / 2) ? " <em>חצי דרך</em>" : "");
    var head = '<div class="label">שאלה ' + (i + 1) + ' מתוך ' + total + tagline + '</div>' +
               '<h2 class="q" tabindex="-1" data-focus>' + esc(q.t) + '</h2>' +
               (q.s ? '<p class="sub">' + esc(q.s) + '</p>' : '');
    var body = "", navR = "";

    if (!q.type){
      body = '<div class="opts" role="group">' + q.o.map(function(o, k){
        var on = A[q.id] && A[q.id].v === o[0];
        return '<button type="button" class="opt' + (on ? ' on' : '') + '" data-v="' + o[0] + '" aria-pressed="' + (on ? 'true' : 'false') + '"><span class="k">' + (k + 1) + '</span><span>' + esc(o[1]) + '</span></button>';
      }).join("") + '</div>';
      if (A[q.id]) navR = '<button class="btn" type="button" id="okNext">המשך <span class="ar">&larr;</span></button>';
    } else if (q.type === "text"){
      body = '<textarea class="field" id="okNote" maxlength="1500" placeholder="כתבו כאן...">' + esc(note) + '</textarea>';
      navR = '<button class="btn" type="button" id="okNext">' + (note ? 'המשך' : 'דילוג') + ' <span class="ar">&larr;</span></button>';
    } else {
      body = '<form id="okForm" novalidate><div class="fields">' +
        fld("name","שם מלא","text","name",C.name,"") +
        fld("biz","שם העסק","text","organization",C.biz,"") +
        fld("phone","טלפון נייד","tel","tel",C.phone,"ltr") +
        fld("email","אימייל","email","email",C.email,"ltr") +
        '<label class="full"><span>אתר או אינסטגרם <i>(לא חובה)</i></span><input class="field" name="link" type="text" dir="ltr" autocomplete="url" maxlength="200" value="' + esc(C.link) + '" placeholder="instagram.com/..."><div class="err"></div></label>' +
        '<div class="hp" aria-hidden="true"><label>fax<input name="fax" tabindex="-1" autocomplete="off"></label></div>' +
        '</div><div class="err" id="okSendErr" role="alert"></div></form>';
      navR = '<button class="btn" type="submit" form="okForm" id="okSend">שליחה <span class="ar">&larr;</span></button>';
    }

    app.innerHTML = '<section class="screen">' + head + body +
      '<div class="nav"><button class="back" type="button" id="okBack">&rarr; חזרה</button>' + navR + '</div></section>';

    document.getElementById("okBack").onclick = function(){ go(i - 1); };
    var nx = document.getElementById("okNext");

    if (!q.type){
      app.querySelectorAll(".opt").forEach(function(b){ b.onclick = function(){ pick(q, b); }; });
      if (nx) nx.onclick = function(){ go(i + 1); };
    } else if (q.type === "text"){
      var ta = document.getElementById("okNote");
      ta.oninput = function(){ note = ta.value; nx.firstChild.nodeValue = (note.trim() ? "המשך" : "דילוג") + " "; };
      nx.onclick = function(){ note = ta.value.trim(); go(i + 1); };
    } else {
      var f = document.getElementById("okForm");
      f.oninput = function(e){ if (e.target.name && C.hasOwnProperty(e.target.name)) C[e.target.name] = e.target.value; };
      f.onsubmit = function(e){ e.preventDefault(); submit(f); };
    }
    focusTitle();
  }

  function fld(name, label, type, ac, val, dir){
    return '<label><span>' + label + '</span><input class="field" name="' + name + '" type="' + type + '" autocomplete="' + ac + '" maxlength="120"' + (dir ? ' dir="' + dir + '"' : '') + ' value="' + esc(val) + '" required><div class="err"></div></label>';
  }

  function pick(q, b){
    var v = b.getAttribute("data-v"), opt = q.o.filter(function(o){return o[0] === v;})[0];
    A[q.id] = {q:q.t, v:v, l:opt[1]};
    if (q.id === "past" && v === "p0") delete A.pastres;
    app.querySelectorAll(".opt").forEach(function(x){ var on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on ? "true" : "false"); });
    setTimeout(function(){ go(i + 1); }, 280);
  }

  function setErr(f, name, msg){ var el = f.querySelector('[name="' + name + '"]').parentNode.querySelector(".err"); el.textContent = msg || ""; return !msg; }

  function submit(f){
    if (sending) return;
    var ok = true, digits = C.phone.replace(/\D/g, "").replace(/^972/, "0");
    ok = setErr(f, "name", C.name.trim().length < 2 ? "רק שם, כדי שנדע למי לפנות" : "") && ok;
    ok = setErr(f, "biz", C.biz.trim().length < 2 ? "איך קוראים לעסק?" : "") && ok;
    ok = setErr(f, "phone", !/^0\d{8,9}$/.test(digits) ? "נראה שחסרה ספרה במספר" : "") && ok;
    ok = setErr(f, "email", !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(C.email.trim()) ? "כתובת המייל לא נראית תקינה" : "") && ok;
    if (!ok){ var bad = f.querySelector(".err:not(:empty)"); if (bad) bad.parentNode.querySelector("input").focus(); return; }

    sending = true;
    var btn = document.getElementById("okSend"), err = document.getElementById("okSendErr");
    btn.disabled = true; btn.innerHTML = 'שולחים <span class="spin"></span>'; err.textContent = "";

    var R = rate(), c = {name:C.name.trim(), biz:C.biz.trim(), phone:C.phone.trim(), email:C.email.trim(), link:C.link.trim()};
    var secs = Math.round((Date.now() - t0) / 1000);
    var fd = new FormData();
    fd.append("_subject", "שאלון התאמה | " + (c.biz || c.name) + " | " + R.score + "/100 | " + R.verd);
    fd.append("_template", "table");
    fd.append("_captcha", "false");
    fd.append("_replyto", c.email);
    fd.append("_honey", f.querySelector('[name="fax"]').value);
    fd.append("ציון", R.score + "/100");
    fd.append("המלצה", R.verd);
    fd.append("חסמים", R.stop.join(" | ") || "אין");
    fd.append("דגלים לבדיקה", R.red.join(" | ") || "אין");
    fd.append("נקודות חזקות", R.green.join(" | ") || "אין");
    fd.append("שם", c.name);
    fd.append("עסק", c.biz);
    fd.append("טלפון", c.phone);
    fd.append("וואטסאפ", "https://wa.me/972" + digits.replace(/^0/, ""));
    fd.append("אימייל", c.email);
    fd.append("אתר או אינסטגרם", c.link || "לא צוין");
    steps().forEach(function(q){
      if (!A[q.id]) return;
      var m = W[q.id], pts = m ? " (" + m[A[q.id].v] + "/" + Math.max.apply(null, Object.keys(m).map(function(k){return m[k];})) + ")" : "";
      fd.append(q.t, A[q.id].l + pts);
    });
    fd.append("מה חשוב שנדע", note || "לא נכתב");
    fd.append("זמן מילוי", Math.floor(secs / 60) + ":" + ("0" + secs % 60).slice(-2) + " דקות");

    fetch(ENDPOINT, {method:"POST", headers:{"Accept":"application/json"}, body:fd})
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(j){ if (j && (j.success === true || j.success === "true")) done(); else throw new Error("send"); })
      .catch(function(){
        sending = false; btn.disabled = false; btn.innerHTML = 'לנסות שוב <span class="ar">&larr;</span>';
        err.textContent = "משהו לא עבד בשליחה. נסו שוב, או התקשרו אלינו: 054-9000-787";
      });
  }

  function rate(){
    function v(id){ return A[id] ? A[id].v : ""; }
    var score = 0, stop = [], red = [], green = [];
    Object.keys(W).forEach(function(id){ var x = W[id][v(id)]; if (x) score += x; });
    if (v("budget") === "b1" || v("budget") === "b2") stop.push("תקציב מתחת ל-7,000 ₪ בחודש");
    if (v("cap") === "c3") stop.push("אין יכולת לטפל בפניות נוספות");
    if (v("when") === "n4") stop.push("רק בודקים אפשרויות");
    if (v("budget") === "b3") red.push("תקציב גבולי, 7 עד 12 אלף כולל מדיה. אולי מסלול 8,500 ₪ ל-3 חודשים");
    if (v("budget") === "b0") red.push("לא יודעים מה התקציב");
    if (v("deal") === "d1") red.push("עסקה קטנה, עד 1,000 ₪");
    if (v("goal") === "brand" || v("goal") === "social") red.push("המטרה מיתוג או רשתות, לא לידים");
    if (v("goal") === "site") red.push("המטרה אתר. אולי פרויקט אתר במקום ריטיינר");
    if (v("speed") === "s3" || v("speed") === "s4") red.push("חוזרים לפניות לאט");
    if (v("track") === "k3") red.push("לא מודדים פניות וסגירות");
    if (v("pastres") === "r3") red.push("מרגישים ששרפו כסף בעבר");
    if (v("commit") === "m0") red.push("רוצים לנסות חודש אחד");
    if (v("commit") === "m1") red.push("רוצים לעבוד חודש-חודש");
    if (v("decide") === "dm3") red.push("ועדה או הנהלה מחליטה");
    if (v("site") === "w3" || v("site") === "w4") red.push("אין אתר. צריך אתר לפני קמפיין");
    if (v("budget") === "b4" || v("budget") === "b5") green.push("תקציב מתאים לריטיינר");
    if (v("deal") === "d3" || v("deal") === "d4") green.push("עסקה שווה מעל 5,000 ₪");
    if (v("commit") === "m3") green.push("מבינים שזה תהליך של 3 חודשים ומעלה");
    if (v("speed") === "s1") green.push("חוזרים לפנייה תוך שעה");
    if (v("track") === "k1") green.push("מודדים פניות וסגירות");
    if (v("when") === "n1" || v("when") === "n2") green.push("רוצים להתחיל בחודש הקרוב");
    var meet = !stop.length && score >= PASS;
    return {score:score, stop:stop, red:red, green:green, verd: meet ? "להיפגש" : "לא מתאים כרגע"};
  }

  function done(){
    setBar(100);
    var black = document.getElementById("okLogoBlack").innerHTML;
    app.innerHTML =
      '<section class="screen">' +
        '<div class="band"><div class="lbl">התשובות התקבלו</div><div class="t" tabindex="-1" data-focus>תודה' + (C.name ? ", " + esc(C.name.trim().split(" ")[0]) : "") + '.</div></div>' +
        '<p class="done-p">עכשיו יש לנו תמונה טובה של העסק. נעבור על התשובות ונחזור אליכם בימים הקרובים עם הצעד הבא.</p>' +
        HILLS +
      '</section>';
    var cl = document.createElement("div");
    cl.className = "closing";
    cl.innerHTML = '<p>נדבר בקרוב.<small>עומר סבן, משרד פרסום OK מהגולן</small></p>' + black;
    app.parentNode.insertBefore(cl, app.nextSibling);
    focusTitle();
  }

  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (i < 0 && e.key === "Enter"){ var g = document.getElementById("okGo"); if (g){ e.preventDefault(); g.click(); } return; }
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9){ var b = app.querySelectorAll(".opt")[n - 1]; if (b) b.click(); }
  });

  welcome();
})();
</script>
